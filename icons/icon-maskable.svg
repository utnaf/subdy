<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sfondo nero puro -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Gruppo per scalare l'icona del 20% (scale 0.8) e centrarla matematicamente -->
  <g transform="translate(71.68, 71.68) scale(0.72)">
    
    <!-- Silhouette corpo del metronomo classico -->
    <path d="M 176 420 L 226 100 L 286 100 L 336 420 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <!-- Base interna del metronomo -->
    <path d="M 216 380 A 40 40 0 0 0 296 380 Z" fill="#FFFFFF"/>

    <!-- Archi Ritmici Centrali -->
    <g stroke-linecap="round" fill="none" stroke-width="6" stroke="#FFFFFF">
      <path d="M 169.40 330 A 100 100 0 0 1 342.60 330"/>
      <path d="M 108.77 295 A 170 170 0 0 1 403.23 295"/>
      <path d="M 48.15 260 A 240 240 0 0 1 463.85 260"/>
    </g>

    <!-- Nodi delle Suddivisioni -->
    <g fill="#FFFFFF">
      <!-- Terzine (3 nodi) -->
      <circle cx="169.40" cy="330.00" r="10"/>
      <circle cx="256.00" cy="280.00" r="10"/>
      <circle cx="342.60" cy="330.00" r="10"/>

      <!-- Sedicesimi (4 nodi) -->
      <circle cx="108.77" cy="295.00" r="10"/>
      <circle cx="197.85" cy="220.33" r="10"/>
      <circle cx="314.15" cy="220.33" r="10"/>
      <circle cx="403.23" cy="295.00" r="10"/>

      <!-- Quintine (5 nodi) -->
      <circle cx="48.15" cy="260.00" r="10"/>
      <circle cx="256.00" cy="140.00" r="10"/>
      <circle cx="376.00" cy="172.15" r="10"/>
      <circle cx="463.85" cy="260.00" r="10"/>
    </g>

    <!-- Nodo Attivo (Il primo nodo della quintina viene evidenziato con un cerchio vuoto) -->
    <circle cx="136.00" cy="172.15" r="22" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="136.00" cy="172.15" r="10" fill="#FFFFFF"/>

    <!-- Pendolo del Metronomo -->
    <g transform="translate(256, 380) rotate(-30)">
      <!-- Asta del pendolo -->
      <line x1="0" y1="0" x2="0" y2="-280" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Peso scorrevole (Slider) con sfondo nero per staccare sull'asta -->
      <rect x="-22" y="-180" width="44" height="48" rx="6" fill="#000000" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Linea sul peso del metronomo -->
      <line x1="-12" y1="-156" x2="12" y2="-156" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

      <!-- Perno centrale in basso -->
      <circle cx="0" cy="0" r="20" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="8" fill="#000000"/>
    </g>
  </g>
</svg>
